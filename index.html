<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Реставрация — расчёт стоимости</title>
  <meta name="description" content="Калькулятор стоимости реставрации деревянных поверхностей">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F3F0EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#100F0D" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Реставрация">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Тема применяется до отрисовки, чтобы не было вспышки.
    try { var t = localStorage.getItem('rc.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>Для работы калькулятора включите JavaScript.</noscript>
  <script type="module" src="js/app.js?v=9"></script>
</body>
</html>
